<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simulador de Postulaciones Electorales · PEL 2026-2027</title>
    <script>
      // Tema y tamaño del texto, antes de que React monte nada. El tema evita el
      // parpadeo claro-oscuro; el tamaño evita algo peor, que la página aparezca
      // y se redimensione entera un instante después. Las claves y la escala
      // deben coincidir con src/lib/tema.ts y src/lib/tipografia.ts.
      ;(function () {
        try {
          var tema = localStorage.getItem('simulador27:tema') || 'sistema'
          var oscuro =
            tema === 'oscuro' ||
            (tema === 'sistema' && matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', oscuro)
          document.documentElement.style.colorScheme = oscuro ? 'dark' : 'light'

          var escala = { pequeno: '87.5%', mediano: '100%', grande: '125%' }
          var texto = localStorage.getItem('simulador27:texto')
          if (escala[texto]) document.documentElement.style.fontSize = escala[texto]
        } catch (e) {
          /* almacenamiento bloqueado: tema claro y tamaño del navegador */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
